packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Versions shared across the workspace; packages depend on them as "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.0.4
  babel-plugin-react-compiler: ^1.0.0
  eslint: ^10.12.0
  eslint-config-next: ^16.4.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  next: ^16.4.1
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: ^0.23.1
  tsx: ^4.23.15
  turbo: ^2.11.8
  typescript: ^6.0.3
  typescript-eslint: ^8.71.2
  vitest: ^5.0.4

minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
