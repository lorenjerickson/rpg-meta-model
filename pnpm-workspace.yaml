packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Versions shared across the workspace; packages depend on them as "catalog:".
catalog:
  '@aws-sdk/client-s3': 3.1143.0
  '@eslint/js': ^10.0.1
  '@nestjs/cli': ^12.0.8
  '@nestjs/common': ^12.1.3
  '@nestjs/core': ^12.1.3
  '@nestjs/platform-express': ^12.1.3
  '@nestjs/testing': ^12.1.3
  '@types/express': ^5.0.6
  '@types/multer': 2.3.0
  '@types/node': ^26.6.5
  '@types/pg': 8.23.1
  '@types/react-dom': ^19.3.0
  '@types/react': ^19.3.0
  '@types/supertest': ^7.2.1
  '@vitest/coverage-v8': ^5.0.4
  babel-plugin-react-compiler: ^1.0.0
  eslint-config-next: ^16.4.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint: ^10.12.0
  lucide-react: 1.49.0
  next: ^16.4.1
  pg: 8.23.0
  prettier: ^3.9.10
  react-dom: ^19.3.1
  react: ^19.3.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  sharp: 0.35.5
  supertest: ^7.3.1
  tsdown: ^0.23.1
  tsx: ^4.23.15
  turbo: ^2.11.8
  typescript-eslint: ^8.71.2
  typescript: ^6.0.3
  vitest: ^5.0.4

minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
