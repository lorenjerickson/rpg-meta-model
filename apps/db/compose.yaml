# Local data services for development: PostgreSQL, and S3-compatible object storage (RustFS) for
# the content repository. The credentials are for local use only.
name: dnd-domain

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      # Defaults for psql and pg_isready inside the container.
      PGUSER: ${POSTGRES_USER:-dnd}
      PGDATABASE: ${POSTGRES_DB:-dnd}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 2s
      timeout: 5s
      retries: 15

  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-dnd-content}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-dnd-content-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:9000/health']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  storage-data:
