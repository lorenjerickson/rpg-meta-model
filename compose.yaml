# The whole stack: PostgreSQL, object storage, the API and the web app. Run from the repository
# root with `pnpm docker:up`, or `pnpm docker:watch` to rebuild and restart the API and web app
# whenever a source they use changes. The credentials are for local use only.
name: dnd-domain

include:
  - apps/db/compose.yaml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The image is a production build, so a change rebuilds it and replaces the container.
    # Paths in .dockerignore (installs, build output) never trigger one.
    develop:
      watch:
        - { action: rebuild, path: apps/api }
        - { action: rebuild, path: packages/ai }
        - { action: rebuild, path: packages/system }
        - { action: rebuild, path: packages/utils }
        - { action: rebuild, path: packages/config }
        - { action: rebuild, path: pnpm-lock.yaml }
    environment:
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-dnd}:${POSTGRES_PASSWORD:-dnd}@postgres:5432/${POSTGRES_DB:-dnd}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-dnd-content}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dnd-content}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dnd-content-secret}
      # Image generation is on when a key is set in the environment or a root .env file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    develop:
      watch:
        - { action: rebuild, path: apps/web }
        - { action: rebuild, path: packages/ai }
        - { action: rebuild, path: packages/system }
        - { action: rebuild, path: packages/ui }
        - { action: rebuild, path: packages/utils }
        - { action: rebuild, path: packages/config }
        - { action: rebuild, path: pnpm-lock.yaml }
    environment:
      API_URL: http://api:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
